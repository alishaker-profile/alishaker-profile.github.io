<style>
/* One narrow column: controls, identity, contact. Dark Midnight Executive by default, light paper mode on toggle. */
:root{
  --ink:#0B1426;--panel:#111D35;--panel-2:#152443;--line:#22304F;--text:#E8E4D8;--muted:#93A0BA;
  --gold:#C9A961;--gold-hi:#D6B872;--gold-soft:rgba(201,169,97,.14);--gold-edge:rgba(201,169,97,.38);--on-gold:#0B1426;
  --ok:#7FC8A0;--glow:rgba(201,169,97,.11);--shadow:rgba(0,0,0,.45);--toast-bg:#E8E4D8;--toast-fg:#0B1426;
  --f-display:"Marcellus","Times New Roman",serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --ink:#F3F5F9;--panel:#FFFFFF;--panel-2:#FBF9F3;--line:#D9DFEA;--text:#0E1A33;--muted:#56627D;
  --gold:#94742A;--gold-hi:#7E6222;--gold-soft:rgba(148,116,42,.10);--gold-edge:rgba(148,116,42,.35);--on-gold:#FFFFFF;
  --ok:#2F9461;--glow:rgba(148,116,42,.10);--shadow:rgba(14,26,51,.14);--toast-bg:#0E1A33;--toast-fg:#F3F5F9;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(60rem 30rem at 50% -10rem,var(--glow),transparent 70%);
  min-height:100vh;padding-inline:16px;padding-block:20px 56px;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
:root[lang="ar"] body{font-family:var(--f-ar)}
.wrap{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:32px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}

.bar{display:flex;justify-content:flex-end;gap:8px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(22rem 22rem at var(--sx,50%) var(--sy,20%),var(--glow),transparent 70%)}
.wrap{position:relative;z-index:1}
.tg{height:36px;min-width:36px;padding-inline:12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:500 .82rem var(--f-mono);letter-spacing:.04em;
  transition:border-color .2s,color .2s,background .2s}
.tg:hover{border-color:var(--gold);color:var(--gold)}
.tg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tg .ar{font-family:var(--f-ar);font-size:.9rem}
.tg .on{color:var(--gold)}
.tg .sep{opacity:.4}
.tg .sun{display:none}
:root[data-mode="light"] .tg .sun{display:block}
:root[data-mode="light"] .tg .moon{display:none}

.id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.photo{position:relative;width:120px;height:120px}
.ring{position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--gold) 75%,var(--gold-hi) 85%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:spin 6s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.photo img{position:relative;width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--gold);
  box-shadow:0 0 0 6px var(--gold-soft),0 18px 40px var(--shadow)}
.photo .dot{z-index:2;animation:beat 2.4s ease-out infinite;position:absolute;inset-inline-end:8px;bottom:8px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:3px solid var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-size:.78rem;
  border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:beat 2.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
.sub{margin:0;color:var(--text);font-size:.95rem;max-width:24rem;text-wrap:balance;opacity:.92}
h1{font-family:var(--f-display);font-weight:400;background:linear-gradient(100deg,var(--text) 30%,var(--gold) 50%,var(--text) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s ease-in-out infinite;font-size:clamp(2.2rem,8vw,2.7rem);line-height:1.1;margin:0;letter-spacing:.01em}
:root[lang="ar"] h1{font-family:var(--f-ar);font-weight:600;font-size:clamp(1.9rem,7vw,2.3rem)}
.role{margin:0;color:var(--muted);font-size:.98rem;max-width:26rem;text-wrap:balance}
.role b{color:var(--text);font-weight:500}
.hook{font-size:1.1rem;line-height:1.85;margin:0;width:100%;text-align:center;
  padding:14px 16px;border:1px solid var(--gold-edge);background:var(--gold-soft);border-radius:14px}
:root[lang="ar"] .hook{font-size:1.12rem}
.hook .lead{display:block}
.hook .kw{display:block;color:var(--gold);font-weight:600;min-height:1.85em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--gold);vertical-align:-.15em;margin-inline-start:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.hook{position:relative;overflow:hidden}
.hook::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,var(--gold-soft) 50%,transparent 65%);
  background-size:250% 100%;animation:sheen 6s ease-in-out infinite;pointer-events:none}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:.74rem;color:var(--muted);letter-spacing:.04em}
:root[lang="en"] .meta{font-family:var(--f-mono);text-transform:uppercase}
.meta span{border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.actions{display:flex;gap:10px;width:100%}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;
  font-weight:500;font-size:.95rem;font-family:inherit;cursor:pointer;border:1px solid var(--gold);transition:transform .15s ease,background .2s ease}
.btn svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.solid{background:var(--gold);color:var(--on-gold)}
.btn.solid:hover{background:var(--gold-hi)}
.cta{position:relative;overflow:hidden;padding-block:14px;font-size:1rem;box-shadow:0 10px 28px color-mix(in srgb,var(--gold) 30%,transparent)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:swipe 3.6s ease-in-out infinite}
@keyframes swipe{0%,55%{left:-60%}100%{left:130%}}
.cta .arrow{display:inline-block;transition:transform .2s ease}
:root[dir="ltr"] .cta .arrow{transform:scaleX(-1)}
:root[dir="rtl"] .cta:hover .arrow{transform:translateX(-4px)}
:root[dir="ltr"] .cta:hover .arrow{transform:scaleX(-1) translateX(-4px)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:var(--gold-soft)}
.btn:active{transform:scale(.98)}

h2{font-weight:500;font-size:.74rem;letter-spacing:.16em;color:var(--gold);margin:0 0 12px}
:root[lang="en"] h2{font-family:var(--f-mono);text-transform:uppercase}
:root[lang="ar"] h2{letter-spacing:0;font-size:.9rem;font-weight:600}
section{display:flex;flex-direction:column}
.links{display:flex;flex-direction:column;gap:10px}
.row{position:relative;overflow:hidden;animation:rise .55s cubic-bezier(.2,.7,.2,1) both;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  transition:border-color .2s ease,transform .2s ease,background .2s ease}
.row::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(14rem 8rem at var(--mx,50%) var(--my,50%),var(--gold-soft),transparent 70%)}
.row:hover::before{opacity:1}
.ic{transition:transform .25s ease}
.row:hover .ic{transform:scale(1.08) rotate(-4deg)}
.row:hover{border-color:var(--gold);background:var(--panel-2);transform:translateY(-1px)}
.row.primary{border-color:var(--gold-edge)}
.link{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding-block:13px;padding-inline:14px 6px}
.ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.t{min-width:0;flex:1}
.t b{display:block;font-weight:500}
.t small{display:block;color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--f-mono);font-size:.8rem}
:root[lang="ar"] .t small.ltr{text-align:right}
.go{color:var(--muted);font-family:var(--f-mono);font-size:.9rem;padding-inline-end:14px}
:root[dir="rtl"] .go{transform:scaleX(-1)}
.copy{flex:none;margin-inline-end:8px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s}
.copy:hover{color:var(--gold);border-color:var(--gold)}
.copy svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--toast-bg);color:var(--toast-fg);font-weight:500;font-size:.9rem;padding:10px 16px;border-radius:99px;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;box-shadow:0 10px 30px var(--shadow);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-align:center}

.grid{display:flex;flex-direction:column;gap:32px}
.photo,.photo img{transition:width .3s,height .3s}
@media (min-width:900px){
  html,body{height:100%}
  body{padding-block:16px;display:flex;overflow-x:hidden}
  .wrap{max-width:68rem;width:100%;gap:8px;min-height:100%}
  .grid{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center}
  .id{align-items:flex-start;text-align:start;gap:clamp(10px,1.6vh,16px)}
  .photo{width:clamp(96px,14vh,136px);height:clamp(96px,14vh,136px)}
  .photo img{width:100%;height:100%}
  h1{font-size:clamp(2.6rem,6.2vh,3.8rem)}
  :root[lang="ar"] h1{font-size:clamp(2.2rem,5.2vh,3.1rem)}
  .hook{padding:clamp(10px,1.6vh,16px) 20px}
  .meta{display:none}
  footer{padding-top:4px}
  .role{font-size:1.06rem;max-width:34rem}
  .sub{font-size:1.02rem;max-width:32rem}
  .hook{text-align:start;font-size:1.3rem;padding:18px 22px}
  :root[lang="ar"] .hook{font-size:1.3rem}
  .meta{justify-content:flex-start}
  .actions{max-width:24rem}
  section{padding:26px;border:1px solid var(--line);border-radius:20px;
    background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 30px 70px var(--shadow)}
  h2{margin-bottom:16px}
  .link{padding-block:16px}
  .t b{font-size:1.05rem}
  footer{text-align:start}
}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.wrap>*{animation:rise .5s ease both}
.grid>*{animation:rise .5s ease both}.grid>*:nth-child(2){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function applyMode(){root.setAttribute('data-mode',mode);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=mode==='light'?'#F3F5F9':'#0B1426'}
document.getElementById('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';store.set('as-lang',lang);applyLang()};
document.getElementById('modeBtn').onclick=()=>{mode=mode==='light'?'dark':'light';store.set('as-mode',mode);applyMode()};
applyMode();applyLang();

document.getElementById('yr').textContent=new Date().getFullYear();
const kw=document.getElementById('kw');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* typewriter */
if(!still){let pos=kw.textContent.length,del=false,pause=26;
  setInterval(()=>{const W=T[lang].words,w=W[wi%W.length];
    if(pause>0){pause--;return}
    if(!del){if(pos<w.length){pos++;kw.textContent=w.slice(0,pos)}else{del=true;pause=28}}
    else{if(pos>0){pos--;kw.textContent=w.slice(0,pos)}else{del=false;wi++;pause=5}}
  },65);
  document.getElementById('langBtn').addEventListener('click',()=>{pos=0;del=false;pause=2;kw.textContent=''});
}
/* cursor spotlight */
addEventListener('pointermove',e=>{root.style.setProperty('--sx',e.clientX+'px');root.style.setProperty('--sy',e.clientY+'px');
  const r=e.target.closest&&e.target.closest('.row');if(r){const b=r.getBoundingClientRect();r.style.setProperty('--mx',(e.clientX-b.left)+'px');r.style.setProperty('--my',(e.clientY-b.top)+'px')}},{passive:true});
/* data constellation */
(()=>{const c=document.getElementById('fx'),x=c.getContext('2d');let W,H,P=[],dpr=Math.min(devicePixelRatio||1,2),m={x:-999,y:-999};
  function size(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(Math.max(24,Math.min(70,W*H/16000)));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.6}))}
  function rgba(h,a){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
  function frame(){const g=getComputedStyle(root).getPropertyValue('--gold').trim()||'#C9A961';x.clearRect(0,0,W,H);
    for(const p of P){if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
        const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<120&&d>0){p.x+=dx/d*.6;p.y+=dy/d*.6}}
      x.fillStyle=rgba(g,.55);x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<130){x.strokeStyle=rgba(g,(1-d/130)*.22);x.lineWidth=.7;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
    if(!still)requestAnimationFrame(frame)}
  addEventListener('resize',()=>{size();if(still)frame()});
  addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY},{passive:true});
  document.getElementById('modeBtn').addEventListener('click',()=>{if(still)frame()});
  size();frame();})();

</script>

</body>
</html>
