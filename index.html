<style>/* Layout: slim sticky header; first screen = identity + contact card; then a decision-first project grid, a coming-soon row, a lab and a contact band. Softened Midnight Executive: dusk navy, muted gold, a sea-teal second accent; warm paper light mode. */
:root{
  --ink:#0F1A2C;--panel:#152238;--panel-2:#1A2942;--line:#283752;--text:#E3DFD4;--muted:#9CA8BD;
  --gold:#D2B57E;--gold-hi:#DDC392;--gold-soft:rgba(210,181,126,.12);--gold-edge:rgba(210,181,126,.32);--on-gold:#132036;
  --teal:#80C4B4;--teal-soft:rgba(128,196,180,.13);--rose:#C99A8C;
  --ok:#80C4B4;--glow:rgba(210,181,126,.08);--shadow:rgba(2,6,16,.42);--veil:rgba(15,26,44,.5);--hdr-bg:rgba(15,26,44,.76);
  --scrim:rgba(6,11,22,.72);--toast-bg:#E3DFD4;--toast-fg:#132036;
  --chip-bg:rgba(10,17,32,.74);--chip-fg:#EADBB8;--chip-line:rgba(210,181,126,.45);--over-fg:#F1EBDD;--over-shade:rgba(10,17,32,.8);
  --f-display:"Marcellus","Times New Roman",serif;
  --f-body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-ar:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --hdr:60px;--max:72rem;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --ink:#F4F2EC;--panel:#FCFBF8;--panel-2:#F7F4ED;--line:#E0DCD1;--text:#1E2A42;--muted:#5F697F;
  --gold:#8D6F30;--gold-hi:#775D26;--gold-soft:rgba(141,111,48,.09);--gold-edge:rgba(141,111,48,.3);--on-gold:#FFFFFF;
  --teal:#2F7D70;--teal-soft:rgba(47,125,112,.1);--rose:#A8705F;
  --ok:#2F8F6A;--glow:rgba(141,111,48,.08);--shadow:rgba(30,42,66,.12);--veil:rgba(244,242,236,.66);--hdr-bg:rgba(244,242,236,.84);
  --scrim:rgba(30,42,66,.5);--toast-bg:#1E2A42;--toast-fg:#F4F2EC;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html.locked{overflow:hidden}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:16px;padding-block:0 32px;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
:root[lang="ar"] body{font-family:var(--f-ar)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
section{scroll-margin-top:calc(var(--hdr) + 16px)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:root[dir="rtl"] .arr{display:inline-block;transform:scaleX(-1)}

/* background layers */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
:root[data-mode="light"] .aurora{opacity:.4}
:root[data-mode="light"] .aurora i{mix-blend-mode:multiply}
.aurora .a1{width:46vw;height:46vw;left:8%;top:6%;background:radial-gradient(circle,var(--gold-soft) 0%,transparent 65%)}
.aurora .a2{width:52vw;height:52vw;right:4%;top:28%;background:radial-gradient(circle,var(--teal-soft) 0%,transparent 65%)}
.aurora .a3{width:40vw;height:40vw;left:30%;bottom:0;background:radial-gradient(circle,color-mix(in srgb,var(--rose) 14%,transparent) 0%,transparent 65%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 58% at 50% 40%,var(--veil),transparent 78%)}
.spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(22rem 22rem at var(--sx,50%) var(--sy,22%),var(--glow),transparent 70%)}
.page{position:relative;z-index:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent;
  transition:background-color .25s ease,border-color .25s ease}
.hdr.scrolled{background:var(--hdr-bg);border-bottom-color:var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hdr-in{max-width:var(--max);margin:0 auto;height:var(--hdr);display:flex;align-items:center;gap:10px}
.brand{display:inline-flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0;font-weight:500}
.mono{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold-edge);background:var(--gold-soft);
  color:var(--gold);font-family:var(--f-display);font-size:.88rem;letter-spacing:.04em}
.brand .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px}
.nav a{padding:8px 12px;border-radius:99px;color:var(--muted);font-size:.9rem;transition:color .2s,background-color .2s}
.nav a:hover{color:var(--text);background:var(--gold-soft)}
.tgs{display:flex;gap:8px}
.tg{height:36px;min-width:36px;padding-inline:12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.04em;
  transition:border-color .2s,color .2s}
.tg:hover{border-color:var(--gold);color:var(--gold)}
.tg .ar{font-family:var(--f-ar);font-size:.9rem}
.tg .on{color:var(--gold)}
.tg .sep{opacity:.4}
.tg .sun{display:none}
:root[data-mode="light"] .tg .sun{display:block}
:root[data-mode="light"] .tg .moon{display:none}
@media (max-width:560px){.brand .bn{display:none}.nav a{padding:8px 9px}.tg{padding-inline:10px}}

/* hero */
.hero{max-width:var(--max);margin:0 auto;padding-block:20px 8px;display:flex;flex-direction:column}
.hero-grid{display:flex;flex-direction:column;gap:30px}
.id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;min-width:0}
.photo{position:relative;width:120px;height:120px;flex:none}
.ring{position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--gold) 75%,var(--gold-hi) 85%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:spin 6s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.photo img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--gold);
  box-shadow:0 0 0 6px var(--gold-soft),0 18px 40px var(--shadow)}
.photo .dot{position:absolute;z-index:2;inset-inline-end:8px;bottom:8px;width:16px;height:16px;border-radius:50%;background:var(--ok);
  border:3px solid var(--ink);animation:beat 2.4s ease-out infinite}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:99px;font-size:.78rem;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:beat 2.4s ease-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(2.2rem,8vw,2.7rem);line-height:1.1;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--text) 55%,var(--gold-hi) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
:root[lang="ar"] h1{font-family:var(--f-ar);font-weight:600;font-size:clamp(1.9rem,7vw,2.3rem);line-height:1.3}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.role{margin:0;color:var(--muted);font-size:.98rem;max-width:30rem;text-wrap:balance}
.role b{color:var(--text);font-weight:500}
.hook{position:relative;overflow:hidden;margin:0;width:100%;font-size:1.08rem;line-height:1.85;padding:12px 4px;
  border-block:1px solid var(--gold-edge);background:radial-gradient(120% 160% at 50% 0%,var(--gold-soft),transparent 70%)}
.hook .lead{display:block}
.hook .kw{display:block;color:var(--gold);font-weight:600;min-height:1.85em;transition:opacity .38s ease,transform .38s ease}
.hook .kw.out{opacity:0;transform:translateY(6px)}
@media (max-width:899px){:root[lang="en"] .hook .kw{min-height:3.7em}}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--gold);vertical-align:-.15em;margin-inline-start:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin:0;font-size:.97rem;max-width:30rem;text-wrap:balance;opacity:.92}
.actions{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.btn{translate:0 0;flex:1 1 11rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;
  font-weight:500;font-size:.98rem;cursor:pointer;border:1px solid var(--gold);transition:transform .15s ease,background-color .2s ease,color .2s ease,translate .45s cubic-bezier(.2,.9,.25,1.2)}
.btn.mag{transition:transform .15s ease,background-color .2s ease,color .2s ease,translate .12s linear}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--gold);color:var(--on-gold)}
.btn.solid:hover{background:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn.ghost:hover{background:var(--gold-soft)}
.cta{position:relative;overflow:hidden;box-shadow:0 10px 28px color-mix(in srgb,var(--gold) 30%,transparent)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;transform:skewX(-20deg);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent)}
.cta:hover::after,.cta.pulse::after{animation:swipe .8s ease-out}
@keyframes swipe{from{left:-60%}to{left:130%}}
.proof{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 0;font-size:.8rem;color:var(--muted)}
.proof li{display:inline-flex;align-items:center}
.proof li+li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold);margin-inline:10px;opacity:.8}
:root[lang="en"] .proof{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.02em}
.chaos{position:relative;width:100%;max-width:30rem;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
.chaos:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:8px}
.bars{position:relative;width:100%;height:56px}
.bar{position:absolute;bottom:0;inset-inline-start:calc(var(--pos)*100%/12);width:calc(100%/12 - 6px);height:calc(var(--h)*1%);
  border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--muted) 42%,transparent);transform:translateY(var(--dy,0px)) rotate(var(--rot,0deg));
  transition:inset-inline-start .65s cubic-bezier(.2,.9,.25,1.18) var(--d,0s),transform .65s cubic-bezier(.2,.9,.25,1.18) var(--d,0s),background-color .45s ease var(--d,0s)}
.chaos.sorted .bar{transform:none}
.chaos.sorted .bar.hi{background:var(--gold)}
.chaos.sorted .bar.lo{background:color-mix(in srgb,var(--teal) 70%,transparent)}
.avg{position:absolute;inset-inline:0;bottom:calc(var(--avg)*1%);border-top:1.5px dashed var(--gold);transform:scaleX(0);transform-origin:left center;
  transition:transform .3s ease 0s;pointer-events:none}
:root[dir="rtl"] .avg{transform-origin:right center}
.chaos.sorted .avg{transform:scaleX(1);transition:transform .55s cubic-bezier(.2,.8,.2,1) .5s}
.chaos-hint{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted);transition:color .3s}
.chaos-hint svg{width:14px;height:14px;color:var(--teal)}
.chaos.sorted .chaos-hint{color:var(--gold)}
:root[lang="en"] .chaos-hint{font-family:var(--f-mono);font-size:.7rem}
.cue{display:none;align-self:center;align-items:center;gap:8px;margin-top:22px;color:var(--muted);font-size:.85rem;transition:color .2s}
.cue:hover{color:var(--gold)}
.cue svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* contact card */
.links-card{padding:18px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--panel) 78%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 30px 70px var(--shadow);min-width:0}
.k-title{margin:0 0 12px;font-weight:500;font-size:.74rem;letter-spacing:.16em;color:var(--gold)}
:root[lang="en"] .k-title,:root[lang="en"] .eyebrow{font-family:var(--f-mono);text-transform:uppercase}
:root[lang="ar"] .k-title,:root[lang="ar"] .eyebrow{letter-spacing:0;font-size:.9rem;font-weight:600}
.links{display:flex;flex-direction:column;gap:10px}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  transition:border-color .2s ease,transform .2s ease,background-color .2s ease}
.row:hover{border-color:var(--gold);background:var(--panel-2);transform:translateY(-1px)}
.row.primary{border-color:var(--gold-edge)}
.row::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s ease;
  background:radial-gradient(150px circle at var(--mx,-200px) var(--my,-200px),var(--gold) 0%,color-mix(in srgb,var(--teal) 70%,transparent) 35%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.links:hover .row::after{opacity:1}
.links:hover .row::before{opacity:.55}
h1[data-i="name"],.role{cursor:default}
.slotw{display:inline-block;position:relative;cursor:ns-resize;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--gold-edge);outline:none}
.slotw.spin{font-family:var(--f-mono);color:var(--teal);border-bottom-color:var(--teal);text-shadow:0 0 12px color-mix(in srgb,var(--teal) 60%,transparent)}
.row::before,.pcard::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;z-index:1;
  background:radial-gradient(14rem 9rem at var(--mx,50%) var(--my,50%),var(--gold-soft),transparent 70%)}
.row:hover::before,.pcard:hover::before{opacity:1}
.row>*{position:relative;z-index:2}
.link{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding-block:13px;padding-inline:14px 6px}
.ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold);transition:transform .25s ease}
.row:hover .ic{transform:scale(1.08) rotate(-4deg)}
.t{min-width:0;flex:1}
.t b{display:block;font-weight:500}
.t small{display:block;color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--f-mono);font-size:.8rem}
:root[dir="rtl"] .t small.ltr{text-align:right}
.go{color:var(--muted);font-family:var(--f-mono);font-size:.9rem;margin-inline-end:14px}
:root[dir="rtl"] .go{transform:scaleX(-1)}
.copy{flex:none;margin-inline-end:8px;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:color .2s,border-color .2s}
.copy:hover{color:var(--gold);border-color:var(--gold)}

@media (min-width:900px){
  .hero{min-height:calc(100vh - var(--hdr));min-height:calc(100svh - var(--hdr) - env(safe-area-inset-top,0px));justify-content:center;padding-block:8px 18px}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:center}
  .id{align-items:flex-start;text-align:start;gap:clamp(10px,1.5vh,16px)}
  .photo{width:clamp(96px,14vh,132px);height:clamp(96px,14vh,132px)}
  h1{font-size:clamp(2.6rem,6vh,3.7rem)}
  :root[lang="ar"] h1{font-size:clamp(2.1rem,5vh,3rem)}
  .hook{text-align:start;font-size:1.25rem;padding:clamp(10px,1.6vh,16px) 2px}
  .actions{max-width:30rem}
  .chaos{align-items:flex-start}
  .bars{height:clamp(40px,6vh,56px)}
  .proof{justify-content:flex-start}
  .links-card{padding:24px}
  .cue{display:inline-flex}
}

/* projects */
.work{max-width:var(--max);margin:0 auto;padding-block:52px 8px}
.sec-head{display:flex;flex-direction:column;gap:16px;margin-bottom:24px}
.sec-copy{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{margin:0;color:var(--gold);font-size:.74rem;letter-spacing:.16em;font-weight:500}
.sec-title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1.15;text-wrap:balance}
:root[lang="ar"] .sec-title{font-family:var(--f-ar);font-weight:600;font-size:clamp(1.45rem,3.6vw,2.05rem);line-height:1.5}
.note{margin:0;display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.92rem;max-width:40rem}
.note svg{margin-top:3px;color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--muted);
  cursor:pointer;font-size:.88rem;transition:color .2s,border-color .2s,background-color .2s}
.chip:hover{color:var(--text);border-color:var(--gold-edge)}
.chip .ct{font-family:var(--f-mono);font-size:.72rem;color:var(--teal)}
.chip[aria-pressed="true"] .ct{color:inherit;opacity:.75}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
@media (min-width:900px){.sec-head{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:32px}.chips{justify-content:flex-end;flex:none}}

.pgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pcard.is-wide{grid-column:1/-1}}
@media (min-width:1000px){.pgrid{grid-template-columns:repeat(6,minmax(0,1fr))}.pcard{grid-column:span 2}.pcard.is-wide{grid-column:1/-1}.pcard.is-half{grid-column:span 3}}
.pcard{position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.pcard{--rx:0deg;--ry:0deg;--lift:0px;transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift))}
.pcard:hover{--lift:-3px;border-color:var(--gold-edge);box-shadow:0 22px 50px var(--shadow)}
.p-cover,.m-cover{position:relative;overflow:hidden;background:var(--panel-2);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.p-cover{aspect-ratio:1.27;max-width:100%;border-bottom:1px solid var(--line)}
.cover-img{position:absolute;inset:0;background-size:cover;background-position:center top;background-repeat:no-repeat;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .cover-img{transform:scale(1.035)}
.p-cover::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .35s ease;mix-blend-mode:screen;
  background:radial-gradient(60% 80% at var(--shx,50%) var(--shy,0%),rgba(255,236,190,.28),transparent 60%),
             linear-gradient(115deg,transparent 35%,rgba(255,240,205,.14) 50%,transparent 65%)}
.pcard:hover .p-cover::after{opacity:1}
.shield{position:absolute;inset:0;z-index:1}
.badge{position:absolute;z-index:2;inset-block-start:12px;inset-inline-start:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;
  font-size:.72rem;font-weight:500;background:var(--chip-bg);color:var(--chip-fg);border:1px solid var(--chip-line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--chip-fg)}
.p-body{position:relative;z-index:2;display:flex;flex-direction:column;gap:8px;padding:16px 18px 18px;flex:1;min-width:0}
.p-sector,.m-sector{margin:0;color:var(--teal);font-size:.76rem;font-weight:500}
:root[lang="en"] .p-sector,:root[lang="en"] .m-sector{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem}
.p-decision{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.22rem;line-height:1.3;text-wrap:balance}
:root[lang="ar"] .p-decision{font-family:var(--f-ar);font-weight:600;font-size:1.02rem;line-height:1.75}
.p-sum{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}
.p-name{margin:0;color:var(--text);opacity:.75;font-size:.84rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.p-open{flex:none;appearance:none;background:none;border:0;padding:0;color:var(--gold);font-weight:500;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.p-open:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.p-tools{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);direction:ltr}
.pcard.is-wide{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.pcard.is-wide .p-cover{border-bottom:0;border-inline-end:1px solid var(--line)}
.pcard.is-wide .p-body{justify-content:center;padding:28px 32px;gap:12px}
.pcard.is-wide .p-decision{font-size:clamp(1.45rem,2.4vw,2rem)}
:root[lang="ar"] .pcard.is-wide .p-decision{font-size:clamp(1.2rem,2vw,1.55rem)}
.pcard.is-wide .p-foot{margin-top:10px}
.pcard.is-wide .p-sum{font-size:1rem}

/* coming soon */
.coming{margin-top:48px}
.coming-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.coming-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.5rem}
:root[lang="ar"] .coming-head h3{font-family:var(--f-ar);font-weight:600;font-size:1.2rem}
.coming-head p{margin:0;color:var(--muted);font-size:.92rem}
.soon{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:900px){.soon{grid-template-columns:repeat(4,minmax(0,1fr))}}
.marquee{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;width:max-content;padding-block:6px;animation:marq 80s linear infinite}
.marquee:hover .track,.marquee:focus-within .track{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.marquee.static{overflow-x:auto;scroll-snap-type:x mandatory;-webkit-mask-image:none;mask-image:none}
.marquee.static .track{animation:none}
.marquee.static .tile{scroll-snap-align:start}
.tile{position:relative;width:100%;aspect-ratio:1.27;max-width:100%;padding:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background-color:var(--panel-2);background-size:cover;background-position:center top;cursor:pointer;text-align:start;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--gold-edge);transform:translateY(-2px)}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,30,.2),var(--over-shade))}
.tile .lk{position:absolute;inset-block-start:10px;inset-inline-start:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--chip-bg);color:var(--chip-fg);border:1px solid var(--chip-line)}
.tile .lk svg{width:15px;height:15px}
.tile .tg2{position:absolute;inset-block-start:12px;inset-inline-end:10px;padding:3px 9px;border-radius:99px;font-size:.68rem;font-weight:500;
  background:var(--chip-bg);color:var(--chip-fg);border:1px solid var(--chip-line)}
.tile .sec{position:absolute;inset-inline:12px;bottom:10px;color:var(--over-fg);font-size:.88rem;font-weight:500;line-height:1.35}

.lab{padding-top:56px}
.lab .sec-title{font-size:clamp(1.5rem,3.4vw,2rem)}
:root[lang="ar"] .lab .sec-title{font-size:clamp(1.25rem,2.8vw,1.6rem)}
.links-slot{margin-bottom:18px}
.links-slot:empty{display:none}
/* contact band */
.contact{max-width:var(--max);margin:56px auto 0}
.band{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:40px 20px;border-radius:24px;
  border:1px solid var(--gold-edge);background:radial-gradient(60% 120% at 50% 0%,var(--gold-soft),transparent 70%),color-mix(in srgb,var(--panel) 82%,transparent)}
.band h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.2;text-wrap:balance}
:root[lang="ar"] .band h2{font-family:var(--f-ar);font-weight:600;font-size:clamp(1.35rem,3.4vw,1.85rem);line-height:1.5}
.band p{margin:0;color:var(--muted);max-width:34rem;text-wrap:balance}
.band .btn{flex:none;min-width:min(17rem,100%)}
footer{max-width:var(--max);margin:26px auto 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:var(--muted);font-size:.78rem}
footer .fm{font-family:var(--f-mono);letter-spacing:.04em}

/* detail view */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease both}
.sheet{position:relative;width:min(64rem,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:minmax(0,1fr);
  background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 100px var(--shadow);animation:pop .32s cubic-bezier(.2,.7,.2,1) both}
.m-left{display:flex;flex-direction:column;min-width:0;background:var(--panel-2)}
.m-cover{aspect-ratio:1.27;max-width:100%}
.m-cover .badge{inset:auto auto 12px 12px}
.m-note{margin:0;display:flex;gap:8px;align-items:flex-start;padding:14px 16px;color:var(--muted);font-size:.82rem}
.m-note svg{width:15px;height:15px;margin-top:2px;color:var(--gold)}
.m-nav{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.navbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-size:.85rem;transition:border-color .2s,color .2s}
.navbtn:hover{border-color:var(--gold);color:var(--gold)}
.m-count{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.m-body{display:flex;flex-direction:column;gap:12px;padding:24px 22px;min-width:0}
.m-decision{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.4rem,3vw,1.85rem);line-height:1.25;text-wrap:balance;padding-inline-end:44px}
:root[lang="ar"] .m-decision{font-family:var(--f-ar);font-weight:600;font-size:clamp(1.15rem,2.4vw,1.45rem);line-height:1.6}
.m-name{margin:0;color:var(--gold);font-weight:500}
.m-sum{margin:0;font-size:1rem}
.m-desc{margin:0;color:var(--muted);font-size:.94rem}
.m-can h4{margin:4px 0 8px;font-size:.74rem;letter-spacing:.14em;color:var(--gold);font-weight:500}
:root[lang="en"] .m-can h4{font-family:var(--f-mono);text-transform:uppercase}
:root[lang="ar"] .m-can h4{letter-spacing:0;font-size:.88rem;font-weight:600}
.m-can ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.m-can li{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.m-can li .ck{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.m-can li .ck svg{width:12px;height:12px;stroke-width:2.4}
.m-tools{margin:0;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.m-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:6px}
.x{position:absolute;z-index:5;inset-block-start:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--text);transition:border-color .2s,color .2s}
.x:hover{border-color:var(--gold);color:var(--gold)}
@media (min-width:900px){
  .sheet{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:hidden}
  .m-left{border-inline-end:1px solid var(--line)}
  .m-body{overflow:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);padding:30px 28px}
}

/* toast */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;max-width:calc(100% - 32px);
  background:var(--toast-bg);color:var(--toast-fg);font-weight:500;font-size:.9rem;padding:10px 16px;border-radius:14px;pointer-events:none;text-align:center;
  transition:opacity .25s ease,transform .25s ease;box-shadow:0 10px 30px var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(14px) scale(.985)}to{transform:none}}
.hero .id>*,.hero .links-card{animation:rise .5s ease both}
.hero .links-card{animation-delay:.12s}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- v15: calmer page, event-driven delight ---------- */
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0}

/* 1 · calm mode: the page goes still; the canvas settles into a grid */
#calmBtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
:root.calm .ring,:root.calm .photo .dot,:root.calm .pill i,:root.calm .cue svg{animation-play-state:paused}
:root.calm .spot{opacity:0}

/* 6 · scroll progress drawn as a rising chart line under the header */
.prog{position:absolute;inset-inline:0;top:100%;height:16px;pointer-events:none;opacity:0;transition:opacity .3s ease}
.hdr.scrolled .prog{opacity:1}
.prog svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
:root[dir="rtl"] .prog svg{transform:scaleX(-1)}
.prog .goal{stroke:var(--gold-edge);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;transition:stroke .4s}
.prog .pl-bg{fill:none;stroke:color-mix(in srgb,var(--muted) 22%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.prog .pl{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.prog .ticks line{stroke:color-mix(in srgb,var(--teal) 60%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.pdot{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.plab{position:absolute;top:10px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;color:var(--gold);
  padding:1px 6px;border-radius:99px;background:var(--hdr-bg);opacity:0;transition:opacity .25s ease;white-space:nowrap}
:root[lang="ar"] .plab{font-family:var(--f-ar);font-size:.66rem;letter-spacing:0}
.prog.moving .plab{opacity:1}
.prog.hit .goal{stroke:var(--gold);stroke-dasharray:none}
.prog.hit .pdot{animation:hit .9s ease-out 1}
@keyframes hit{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (hover:none){.plab{display:none}}

/* 5 · scroll-linked motion: section rules draw in, covers settle in their frames */
.sec-title::after,.band h2::after{content:"";display:block;width:72px;height:2px;margin-top:14px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--teal));transform:scaleX(0);transform-origin:left center;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
:root[dir="rtl"] .sec-title::after,:root[dir="rtl"] .band h2::after{transform-origin:right center;background:linear-gradient(270deg,var(--gold),var(--teal))}
.band h2::after{margin-inline:auto;transform-origin:center}
:root[dir="rtl"] .band h2::after{transform-origin:center}
.sec-title.drawn::after,.band h2.drawn::after{transform:scaleX(1)}
@supports (animation-timeline:view()){
  .sec-title,.band h2{view-timeline-name:--rule}
  .sec-title::after,.band h2::after{transition:none;animation:draw linear both;animation-timeline:--rule;animation-range:entry 15% cover 40%}
  .pgrid .p-cover{view-timeline-name:--cv}
  .pgrid .cover-img{transform-origin:100% 100%;animation:settle linear both;animation-timeline:--cv;animation-range:entry 0% cover 55%}
}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes settle{from{scale:1.08}to{scale:1}}

/* contact band: NDA line */
.band .nda{margin:-2px 0 2px;display:inline-flex;align-items:flex-start;gap:9px;max-width:min(48rem,100%);padding:9px 16px;border-radius:12px;
  border:1px solid var(--gold-edge);background:color-mix(in srgb,var(--gold) 5%,transparent);color:var(--text);font-size:.9rem;line-height:1.65;text-align:start}
.nda svg{width:16px;height:16px;margin-top:3px;color:var(--gold)}

/* 7 · card cover flies into the detail view and back */
.fly{position:fixed;z-index:65;pointer-events:none;border-radius:14px;overflow:hidden;background-color:var(--panel-2);background-size:cover;
  background-position:center top;background-repeat:no-repeat;box-shadow:0 30px 70px var(--shadow)}
.modal.morph .m-cover{visibility:hidden}
.pcard.lifted .p-cover{visibility:hidden}

/* 4 · press and hold to explain the screen */
.m-cover{cursor:help;touch-action:pan-y}
.ann{position:absolute;inset:0;z-index:3;pointer-events:none}
.ann::before{content:"";position:absolute;inset:0;background:rgba(6,11,22,.42);opacity:0;transition:opacity .35s ease}
.ann.on::before{opacity:1}
.mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:.82rem;font-weight:500;background:var(--gold);color:var(--on-gold);border:2px solid #fff;
  box-shadow:0 6px 18px rgba(0,0,0,.45);transform:scale(0);transition:transform .45s cubic-bezier(.2,.9,.3,1.4)}
.ann.on .mk{transform:scale(1)}
.ann.on .mk:nth-child(2){transition-delay:.12s}
.ann.on .mk:nth-child(3){transition-delay:.24s}
.mk::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--gold);opacity:0}
.ann.on .mk::after{animation:ripple .9s ease-out 1 both}
.ann.on .mk:nth-child(2)::after{animation-delay:.12s}.ann.on .mk:nth-child(3)::after{animation-delay:.24s}
@keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.mk.hl{transform:scale(1.25)!important}
.hold{position:absolute;z-index:4;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;transform:rotate(-90deg)}
.hold circle{fill:color-mix(in srgb,var(--ink) 35%,transparent);stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:113.1}
.hold.on circle{stroke-dashoffset:0;transition:stroke-dashoffset .6s linear}
.hold.done{animation:holdDone .35s ease-out forwards}
@keyframes holdDone{to{opacity:0;transform:rotate(-90deg) scale(1.6)}}
.m-exrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 16px 0}
.m-exbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding-inline:12px;border-radius:99px;border:1px solid var(--gold-edge);
  background:var(--gold-soft);color:var(--gold);font-size:.84rem;font-weight:500;cursor:pointer;transition:border-color .2s,background-color .2s}
.m-exbtn:hover,.m-exbtn[aria-pressed="true"]{border-color:var(--gold)}
.m-exbtn svg{width:16px;height:16px}
.m-exrow small{color:var(--muted);font-size:.76rem}
.m-ex{list-style:none;margin:0;padding:12px 16px 0;display:grid;gap:8px}
.m-ex li{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;line-height:1.55;cursor:default;animation:rise .4s ease both}
.m-ex li:nth-child(2){animation-delay:.08s}.m-ex li:nth-child(3){animation-delay:.16s}
.m-ex li .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:1px;
  font-family:var(--f-mono);font-size:.7rem;background:var(--gold);color:var(--on-gold)}
.m-ex li b.role{display:inline-block;padding:0 9px;margin-inline-end:6px;border-radius:99px;background:var(--gold-soft);border:1px solid var(--gold-edge);color:var(--gold);font-weight:600;font-size:.78rem;line-height:1.7;vertical-align:1px}
.m-safe{flex-basis:100%;margin:2px 0 0;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem}
.m-safe svg{width:14px;height:14px;color:var(--teal)}
@media (min-width:900px){.m-left{overflow:auto;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}}

/* 8 · before/after on every card: the raw spreadsheet vs the dashboard (an RTL sheet in Arabic, like Arabic Excel) */
.p-cover.ba{container-type:inline-size}
.xl{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;background:#fff;color:#1F1F1F;
  font-family:Calibri,Carlito,"Aptos Narrow","Segoe UI",Arial,sans-serif;font-size:clamp(6px,2.05cqw,11px);line-height:1;
  clip-path:inset(0 calc(100% - var(--cut)) 0 0);-webkit-user-select:none;user-select:none;box-shadow:inset 0 0 0 1px #D4D4D4}
:root[dir="rtl"] .xl{clip-path:inset(0 0 0 calc(100% - var(--cut)))}
.xl .tb{display:flex;align-items:center;justify-content:center;gap:.7em;flex:none;height:max(2.9em,22px);padding-inline:.8em;background:#1D6F42;color:#fff;white-space:nowrap;overflow:hidden;direction:ltr}
.xl .tb .tbf{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.xl .tb .tbs{color:rgba(255,255,255,.72);font-size:.92em}
.xl .tb .tbs::before{content:"·";margin-inline-end:.7em}
.xl .fx{display:flex;align-items:stretch;height:2.5em;flex:none;background:#fff;border-bottom:1px solid #D4D4D4;color:#1F1F1F;white-space:nowrap;overflow:hidden}
.xl .fx .nb{width:5.4em;flex:none;display:flex;align-items:center;padding-inline:.6em;border-inline-end:1px solid #D4D4D4;font-size:.95em}
.xl .fx .fxi{width:3em;flex:none;display:grid;place-items:center;border-inline-end:1px solid #D4D4D4;color:#616161}
.xl .fx .fxi i{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:1.05em}
.xl .fx .fv{flex:1;min-width:0;display:flex;align-items:center;padding-inline:.7em;overflow:hidden}
.xl .gr{flex:1;min-height:0;display:grid;grid-auto-rows:1fr;overflow:hidden;background:#fff}
.xl .gr span{direction:ltr;display:flex;align-items:center;min-width:0;padding:0 .45em;white-space:nowrap;overflow:hidden;
  border-inline-end:1px solid #E1E1E1;border-bottom:1px solid #E1E1E1}
.xl .gr .h{justify-content:center;background:#F3F3F3;color:#5F5F5F;border-color:#D4D4D4;padding:0}
.xl .gr .h.c0{background:#F3F3F3 linear-gradient(135deg,transparent 62%,#BDBDBD 62% 70%,transparent 70%)}
.xl .gr .h.hs{background:#E2E2E2;color:#0E6B3A;font-weight:700;box-shadow:inset 0 -2px #107C41}
.xl .gr .h.r.hs{box-shadow:inset -2px 0 #107C41}
:root[dir="rtl"] .xl .gr .h.r.hs{box-shadow:inset 2px 0 #107C41}
.xl .gr .s{justify-content:flex-start}
.xl .gr .n{justify-content:flex-end;font-variant-numeric:tabular-nums}
:root[dir="rtl"] .xl .gr .s{justify-content:flex-end}
:root[dir="rtl"] .xl .gr .n{justify-content:flex-start}
.xl .gr .t{font-weight:700;gap:.3em;border-bottom:1.5px solid #ABABAB;direction:inherit;justify-content:space-between}
.xl .gr .t em{font-style:normal;direction:ltr;unicode-bidi:isolate;flex:1;min-width:0;overflow:hidden;text-align:left}
:root[dir="rtl"] .xl .gr .t em{text-align:right}
.xl .gr .t .fl{flex:none;width:1.15em;height:1.15em;border:1px solid #BDBDBD;border-radius:2px;background:#fff;position:relative}
.xl .gr .t .fl::after{content:"";position:absolute;left:50%;top:50%;margin:-.12em 0 0 -.25em;border:.25em solid transparent;border-top:.3em solid #616161;border-bottom:0}
.xl .gr .sel{box-shadow:inset 0 0 0 2px #107C41;position:relative}
.xl .gr .sel::after{content:"";position:absolute;right:-1px;bottom:-1px;width:.45em;height:.45em;background:#107C41;border:1px solid #fff}
.xl .tabs{display:flex;align-items:stretch;flex:none;height:2.4em;padding-inline:.4em;background:#F3F3F3;border-top:1px solid #D4D4D4;overflow:hidden;white-space:nowrap;color:#5F5F5F}
.xl .tabs .nav{display:grid;place-items:center;width:1.7em;font-size:.7em;font-weight:400;color:#9E9E9E}
.xl .tabs i{font-style:normal;display:flex;align-items:center;padding-inline:.9em;border-inline-end:1px solid #DADADA}
.xl .tabs i.on{background:#fff;color:#0E6B3A;font-weight:700;box-shadow:inset 0 -2px #107C41}
.xl .tabs .add{display:grid;place-items:center;width:1.5em;height:1.5em;margin:auto .6em;border-radius:50%;border:1px solid #BDBDBD;font-weight:400;color:#616161}
.bah{position:absolute;z-index:4;top:0;bottom:0;inset-inline-start:var(--cut,40%);width:44px;margin-inline-start:-22px;padding:0;border:0;background:none;
  cursor:ew-resize;touch-action:none;display:grid;place-items:center}
.bah::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--gold);box-shadow:0 0 12px rgba(0,0,0,.35)}
.bah .knob{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);
  border:2px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.4);transition:transform .2s ease}
.bah:hover .knob,.bah:focus-visible .knob,.dragging .bah .knob{transform:scale(1.12)}
.bah .knob svg{width:16px;height:16px;stroke-width:2.2}
.balab{position:absolute;z-index:3;top:clamp(2px,.75cqw,5px);padding:.2em .85em;border-radius:99px;font-size:clamp(9px,1.85cqw,11px);line-height:1.5;font-weight:500;white-space:nowrap;
  background:var(--chip-bg);color:var(--chip-fg);border:1px solid var(--chip-line);pointer-events:none;transition:opacity .2s}
.balab.b{inset-inline-start:10px}.balab.a{inset-inline-end:10px}
.pcard.dragging{cursor:ew-resize}

/* 2 · theme and language changes as one motion */
html.vt-theme *{transition:none!important}
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-lang .brand{view-transition-name:vt-brand}
html.vt-lang .nav{view-transition-name:vt-nav}
html.vt-lang .tgs{view-transition-name:vt-tgs}
html.vt-lang .hero .photo{view-transition-name:vt-photo}
html.vt-lang .hero .pill{view-transition-name:vt-pill}
html.vt-lang .hero h1{view-transition-name:vt-name}
html.vt-lang .hero .role{view-transition-name:vt-role}
html.vt-lang .hero .actions{view-transition-name:vt-actions}
html.vt-lang #linksCard{view-transition-name:vt-links}
html.vt-lang::view-transition-group(*){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
html.vt-lang::view-transition-old(root),html.vt-lang::view-transition-new(root){animation-duration:.35s}

@media (prefers-reduced-motion:reduce){.sec-title::after,.band h2::after{transform:none}.pgrid .cover-img{scale:1}}

/* live dashboard: card and modal entry points */
.ldot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.p-live .ldot,.m-live .ldot{position:relative}
.p-live .ldot::after,.m-live .ldot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);opacity:0;animation:livePing 2.4s ease-out infinite}
@keyframes livePing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
:root.calm .ldot::after{animation:none}
@media (prefers-reduced-motion:reduce){.ldot::after{animation:none!important}}
.p-live{display:inline-flex;align-items:center;gap:8px;margin-inline-start:auto;margin-inline-end:10px;padding:7px 13px;border-radius:99px;cursor:pointer;
  border:1px solid var(--gold-edge);background:var(--gold-soft);color:var(--text);font:inherit;font-size:.82rem;font-weight:500;transition:border-color .2s,background-color .2s}
.p-live:hover,.p-live:focus-visible{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,transparent)}
.m-live{display:flex;align-items:center;justify-content:center;gap:9px;width:calc(100% - 32px);margin:12px 16px 0;padding:11px 14px;border-radius:12px;cursor:pointer;
  border:1px solid var(--gold-edge);background:var(--gold-soft);color:var(--text);font:inherit;font-size:.9rem;font-weight:500;transition:border-color .2s}
.m-live:hover,.m-live:focus-visible{border-color:var(--gold)}

/* live dashboard overlay */
.live{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#0F1637}
:root[data-mode="light"] .live{background:#F4F1E8}
.live-bar{flex:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 18px;padding-top:max(8px,env(safe-area-inset-top));
  background:var(--hdr-bg);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text)}
:root[dir="rtl"] .live-bar{padding:8px 18px 8px 12px}
.live-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.live-t b{font-family:var(--f-display);font-weight:400;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-t small{color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-t .sep{margin-inline:6px;opacity:.6}
.live .x{position:static;flex:none}
.live-body{position:relative;flex:1;min-height:0}
.live-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .35s ease;background:transparent}
.live-body iframe.on{opacity:1}
.live-load{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--muted);font-size:.9rem}
.live-load .spin{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@media (max-width:560px){.live-t small .sep,.live-t small span:last-child{display:none}}

/* how I work */
.steps{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;counter-reset:none}
.steps li{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px 18px 22px;border-radius:18px;border:1px solid var(--line);background:var(--panel)}
.steps li::after{content:"";position:absolute;top:38px;inset-inline-end:-15px;width:16px;height:1px;background:var(--gold-edge)}
.steps li:last-child::after{display:none}
.steps .sn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;color:var(--gold);
  border:1px solid var(--gold-edge);background:var(--gold-soft)}
.steps h3{margin:0 0 6px;font-size:1rem;font-weight:600;line-height:1.45;color:var(--text)}
.steps p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.7}
@media (max-width:980px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps li:nth-child(2)::after{display:none}}
@media (max-width:560px){.steps{grid-template-columns:1fr;gap:10px}
  .steps li{flex-direction:row;align-items:flex-start;padding:16px}
  .steps li::after{top:auto;bottom:-11px;inset-inline-start:36px;inset-inline-end:auto;width:1px;height:10px}
  .steps li:nth-child(2)::after{display:block}}
@media (prefers-reduced-motion:reduce){.live-load .spin{animation-duration:2.4s}}

/* header: the second link goes to How I work; a shorter label on narrow phones */
.nav a .ns{display:none}
.brand .mono{flex:none}
@media (max-width:430px){.nav a{white-space:nowrap;font-size:.84rem;padding:8px 7px}.hdr-in{gap:6px}.tg{padding-inline:9px}}
@media (max-width:369px){.nav a .nl{display:none}.nav a .ns{display:inline}}
/* footer: profile buttons */
footer .fsoc{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
footer .soc{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--gold-edge);
  background:var(--panel);color:var(--text);font-size:.92rem;font-weight:500;transition:border-color .2s,color .2s,background-color .2s}
footer .soc svg{width:18px;height:18px;color:var(--gold)}
footer .soc:hover,footer .soc:focus-visible{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}

</style>

, var(--glow-a), transparent 62%),\n    radial-gradient(760px 480px at 100% -4%, var(--glow-b), transparent 60%),\n    radial-gradient(var(--dots) 1px, transparent 1.2px) 0 0 / 22px 22px;\n}\nbutton, input, select { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }\n::selection { background: var(--gold-wash); }\n\n.app {\n  position: relative;\n  max-width: 1480px;\n  margin: 0 auto;\n  padding-inline: clamp(16px, 3.2vw, 44px);\n  padding-block: clamp(18px, 3vw, 34px) 40px;\n}\n\n/* ---------- masthead ---------- */\n.mast {\n  display: flex;\n  align-items: flex-end;\n  justify-content: space-between;\n  gap: 20px 32px;\n  flex-wrap: wrap;\n  padding-bottom: 20px;\n  border-bottom: 1px solid var(--line);\n}\n.mast-text { min-width: 0; max-width: 760px; }\n.eyebrow {\n  margin: 0 0 10px;\n  font: 500 11px/1.2 var(--f-mono);\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--gold-ink);\n  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;\n}\n.eyebrow .sep { width: 18px; height: 1px; background: var(--gold-line); }\n.title {\n  margin: 0;\n  font: 400 clamp(30px, 4.2vw, 46px)/1.04 var(--f-display);\n  letter-spacing: 0.005em;\n  text-wrap: balance;\n}\n.title em { font-style: normal; color: var(--gold-ink); }\n.lede { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; max-width: 62ch; }\n.mast-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }\n.asof {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 7px 12px; border-radius: 999px;\n  border: 1px solid var(--line-2); background: var(--surface);\n  font: 500 11.5px var(--f-mono); color: var(--ink-2); letter-spacing: 0.02em;\n}\n.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--good)); position: relative; flex: none; transition: background .3s; }\n.pulse::after {\n  content: \"\"; position: absolute; inset: -4px; border-radius: 50%;\n  border: 1px solid var(--pc, var(--good)); opacity: 0; animation: pulse 2.2s ease-out infinite;\n}\n.pulse.gold { --pc: var(--gold); }\n.pulse.off { background: var(--muted); }\n.pulse.off::after { animation: none; }\n@keyframes pulse { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }\n\n.theme-btn {\n  width: 38px; height: 38px; border-radius: 50%;\n  display: inline-grid; place-items: center;\n  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);\n  transition: border-color .2s, color .2s, transform .2s;\n}\n.theme-btn:hover { border-color: var(--gold-line); color: var(--gold-ink); }\n.theme-btn svg { width: 18px; height: 18px; }\n.theme-btn .i-sun { display: none; }\n.theme-btn[data-mode=\"dark\"] .i-sun { display: block; }\n.theme-btn[data-mode=\"dark\"] .i-moon { display: none; }\n\n/* ---------- filters ---------- */\n.filters {\n  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 22px;\n  padding-block: 18px 6px;\n}\n.field { display: grid; gap: 6px; min-width: 0; }\n.field-label {\n  font: 500 10.5px var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);\n}\n.seg {\n  position: relative; display: inline-flex; gap: 2px; padding: 3px;\n  background: var(--surface); border: 1px solid var(--line-2); border-radius: 11px;\n  max-width: 100%; overflow-x: auto; scrollbar-width: none;\n}\n.seg::-webkit-scrollbar { display: none; }\n.seg button {\n  position: relative; z-index: 1; border: 0; background: transparent; color: var(--muted);\n  font: 500 13px/1 var(--f-sans); padding: 8px 13px; border-radius: 8px; white-space: nowrap;\n  transition: color .2s;\n}\n.seg button:hover { color: var(--ink); }\n.seg button[aria-checked=\"true\"] { color: var(--ink); }\n.seg-ind {\n  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 8px;\n  background: var(--gold-wash); box-shadow: inset 0 0 0 1 ne-2); text-underline-offset: 4px;\n}\n.link-btn:hover { color: var(--gold-ink); text-decoration-color: var(--gold-line); }\n.range { display: grid; gap: 6px; min-width: 200px; }\n.range-row { display: flex; align-items: center; gap: 12px; }\n.range output { font: 500 12.5px var(--f-mono); color: var(--ink); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }\ninput[type=\"range\"] {\n  -webkit-appearance: none; appearance: none; width: 100%; min-width: 120px; height: 22px; background: transparent; margin: 0;\n  --pct: 50%;\n}\ninput[type=\"range\"]::-webkit-slider-runnable-track {\n  height: 4px; border-radius: 4px;\n  background: linear-gradient(90deg, var(--gold) 0 var(--pct), var(--line-2) var(--pct) 100%);\n}\ninput[type=\"range\"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line-2); }\ninput[type=\"range\"]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--gold); }\ninput[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;\n  background: var(--surface-2); border: 2px solid var(--gold); box-shadow: 0 0 0 4px var(--gold-wash);\n}\ninput[type=\"range\"]::-moz-range-thumb {\n  width: 14px; height: 14px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--gold);\n  box-shadow: 0 0 0 4px var(--gold-wash);\n}\n\n/* ---------- KPI band ---------- */\n.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }\n.kpi {\n  position: relative; min-width: 0; overflow: hidden;\n  background: linear-gradient(180deg, var(--panel-hi), transparent 60%), var(--surface);\n  border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 12px;\n  display: grid; grid-template-rows: auto auto auto 1fr; gap: 6px;\n  animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards;\n}\n.kpi-label { font: 500 12.5px var(--f-sans); color: var(--ink-2); display: flex; align-items: center; gap: 8px; }\n.kpi-label .k-sw { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px var(--gold-wash); flex: none; }\n.kpi-value { font: 600 clamp(24px, 2.4vw, 32px)/1.1 var(--f-sans); letter-spacing: -0.01em; white-space: nowrap; }\n.kpi-value small { font-size: 0.55em; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }\n.kpi-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }\n.kpi-spark { height: 38px; margin: 2px -4px 0; align-self: end; }\n.kpi-spark svg { display: block; width: 100%; height: 38px; overflow: visible; }\n\n.delta {\n  display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 6px; border-radius: 999px;\n  font: 600 11.5px/1.4 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap;\n  background: var(--surface-3); color: var(--ink-2);\n}\n.delta svg { width: 9px; height: 9px; }\n.delta.good { color: var(--good-ink); background: var(--good-wash); }\n.delta.bad { color: var(--crit-ink); background: var(--crit-wash); }\n.delta.warn { color: var(--warn-ink); background: var(--warn-wash); }\n\n/* ---------- panels ---------- */\n.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }\n.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }\n.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; }\n.span-9 { grid-column: span 9; } .span-12 { grid-column: span 12; }\n.panel {\n  position: relative; isolation: isolate; min-width: 0;\n  background: linear-gradient(180deg, var(--panel-hi), transparent 120px), var(--surface);\n  border: 1px solid var(--line); border-radius: 18px;\n  padding: 18px 20px 18px;\n  box-shadow: var(--shadow);\n  display: flex; flex-direction: column; gap: 14px;\n  animation: rise .8s cubic-bezier(.2, .8, .2, 1) backwards;\n}\n.     for(let i=0;i<P.length;i++){const a=P[i];
      for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
        let al=d<120?(1-d/120)*.15*(1-e):0;if(isCalm&&d<glim)al+=.09*e;
        if(al>.004){x.strokeStyle=col(G,al);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
        if(mv&&d<120&&d>50)links.push([i,j])}
      if(mv){const dm=Math.hypot(a.x-m.x,a.y-m.y);if(dm<150){x.strokeStyle=col(E,(1-dm/150)*.3);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(m.x,m.y);x.stroke()}}}
    if(mv&&!lite){
      if(t-lastPulse>.45&&links.length&&Q.length<14){lastPulse=t;const L=links[Math.floor(Math.random()*links.length)];Q.push({a:L[0],b:L[1],s:t,dur:1.4+Math.random()*.8,c:Math.random()<.5?E:G})}
      Q=Q.filter(q=>{const k=(t-q.s)/q.dur;if(k>=1||!P[q.a]||!P[q.b])return false;const A=P[q.a],B=P[q.b],px=A.x+(B.x-A.x)*k,py=A.y+(B.y-A.y)*k,al=Math.sin(k*Math.PI);
        const g=x.createRadialGradient(px,py,0,px,py,9);g.addColorStop(0,col(q.c,.75*al));g.addColorStop(1,col(q.c,0));
        x.fillStyle=g;x.beginPath();x.arc(px,py,9,0,7);x.fill();
        x.strokeStyle=col(q.c,.35*al);x.lineWidth=1.1;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(px,py);x.stroke();x.lineWidth=.7;return true});
      const LIFE=1.3;TR=TR.filter(p=>t-p.t<LIFE);
      for(let i=1;i<TR.length;i++){const a=TR[i-1],b=TR[i],age=(t-b.t)/LIFE,al=(1-age)*.55;
        x.strokeStyle=col(i/TR.length>.5?G:E,al);x.lineWidth=2.2*(1-age)+.3;x.lineCap="round";x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
      x.lineWidth=.7;x.font=FONT;
      for(const p of TR){if(!p.bit)continue;const age=(t-p.t)/LIFE;x.fillStyle=col(p.c?G:E,(1-age)*.6);x.fillText(p.bit,p.x+p.ox,p.y+p.oy-age*18)}
    }
  }
  function goLite(){lite=true;root.classList.add("lite");P=P.slice(0,count());Q=[];TR=[];if(isCalm)gridTargets()}
  function loop(now){running=false;draw(now);
    if(!lite&&lastTs&&samples.length<120){samples.push(now-lastTs);if(samples.length===120){const s2=samples.slice().sort((a,b)=>a-b);if(s2[60]>22)goLite()}}
    if(shouldRun()){lastTs=now;running=true;requestAnimationFrame(loop)}else lastTs=0}
  function kick(){if(!running&&shouldRun()){running=true;lastTs=0;requestAnimationFrame(loop)}}
  function redraw(){readColors();if(!running)draw(performance.now())}
  function setCalm(on){if(on===isCalm)return;isCalm=on;Q=[];TR=[];
    if(on){gridTargets();if(still){P.forEach(p=>{p.x=p.gx;p.y=p.gy})}else{P.forEach(p=>{p.fx=p.x;p.fy=p.y});settle=performance.now()}}
    else{settle=null;P.forEach(p=>{p.vx=(Math.random()-.5)*.26;p.vy=(Math.random()-.5)*.26})}
    kick();if(!running)draw(performance.now())}
  addEventListener("resize",()=>{size();if(!running)draw(performance.now())});
  addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY;lastMove=performance.now();if(!moving())return;kick();if(lite)return;
    const t=(performance.now()-t0)/1000,last=TR[TR.length-1];
    if(!last||Math.hypot(last.x-m.x,last.y-m.y)>4){const p={x:m.x,y:m.y,t};
      if(t-lastBit>.09){lastBit=t;p.bit=Math.random()<.5?"0":"1";p.ox=(Math.random()-.5)*14;p.oy=(Math.random()-.5)*14;p.c=Math.random()<.5}
      TR.push(p);if(TR.length>70)TR.shift()}},{passive:true});
  document.addEventListener("pointerleave",()=>{m.x=-9999;m.y=-9999});
  document.addEventListener("visibilitychange",kick);
  const hero=document.querySelector(".hero");
  if(hero&&"IntersectionObserver" in window)new IntersectionObserver(es=>{heroIn=es[es.length-1].isIntersecting;kick()}).observe(hero);
  readColors();size();draw(performance.now());kick();
  return {kick,redraw,setCalm};
})();

/* 1 · calm mode */
function applyCalm(){root.classList.toggle("calm",calm);$("calmBtn").setAttribute("aria-pressed",String(calm));FX.setCalm(calm)}
$("calmBtn").onclick=()=>{calm=!calm;store.set("as-calm",calm?"1":"0");applyCalm();toast(calm?T[lang].calmOn:T[lang].calmOff);track(calm?"calm_on":"calm_off")};
applyCalm();

/* 6 · scroll progress as a rising chart line */
(()=>{const pr=$("prog"),pl=$("pl"),bg=$("plBg"),dot=$("pdot"),lab=$("plab"),ticks=$("progTicks");if(!pr)return;
  let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const N=28,pts=[];for(let i=0;i<=N;i++){const k=i/N,trend=14-11.6*Math.pow(k,1.15);pts.push([k*1000,i===N?2:Math.max(2.8,Math.min(15,trend+(rnd()-.5)*3.2))])}
  const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(2)).join(" L");pl.setAttribute("d",d);bg.setAttribute("d",d);
  const rect=$("plRect"),yAt=x=>{const f=Math.min(N,Math.max(0,x/1000*N)),i=Math.min(N-1,Math.floor(f)),t=f-i;return pts[i][1]+(pts[i+1][1]-pts[i][1])*t};
  let marks=[],hit=false,hitOnce=false,idle=0,raf=0;
  function update(){raf=0;const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=Math.min(1,Math.max(0,scrollY/max));
    rect.setAttribute("width",(p*1000+4).toFixed(1));const pt={x:p*1000,y:yAt(p*1000)},xp=pt.x/10,xx=root.dir==="rtl"?100-xp:xp;
    dot.style.left=`clamp(6px,${xx.toFixed(2)}%,calc(100% - 6px))`;dot.style.top=(pt.y/16*100)+"%";lab.style.left=Math.min(95,Math.max(5,xx))+"%";
    let cur=marks[0];for(const mk of marks)if(p+.002>=mk.p)cur=mk;lab.textContent=cur?(T[lang].secs||{})[cur.id]||"":"";
    const h=p>.985;if(h!==hit){hit=h;pr.classList.toggle("hit",h);if(h&&!hitOnce){hitOnce=true;track("progress_goal")}}}
  function measure(){const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    marks=["top","work","lab","how","contact"].map(id=>{const el=$(id);return el?{id,p:Math.min(1,Math.max(0,(el.getBoundingClientRect().top+scrollY-innerHeight*.3)/max))}:null}).filter(Boolean);
    ticks.innerHTML=marks.slice(1).map(mk=>{const xv=(mk.p*1000).toFixed(1);return `<line x1="${xv}" y1="6" x2="${xv}" y2="15"/>`}).join("");update()}
  addEventListener("scroll",()=>{pr.classList.add("moving");clearTimeout(idle);idle=setTimeout(()=>pr.classList.remove("moving"),900);if(!raf)raf=requestAnimationFrame(update)},{passive:true});
  addEventListener("resize",measure);addEventListener("load",measure);setTimeout(measure,500);window.progMeasure=measure;measure();
})();

/* 5 · section rules draw in on scroll (fallback where scroll-linked CSS is missing) */
if(!(window.CSS&&CSS.supports&&CSS.supports("animation-timeline","view()"))){
  const rules=document.querySelectorAll(".sec-title,.band h2");
  if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("drawn");io.unobserve(e.target)}}),{rootMargin:"0px 0px -18% 0px"});rules.forEach(r=>io.observe(r))}
  else rules.forEach(r=>r.classList.add("drawn"));
}

</script>
